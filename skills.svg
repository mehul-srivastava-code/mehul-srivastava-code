<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:'Courier New',Consolas,monospace;font-size:16px}
.cmd{fill:#39ff14}.out{fill:#c9d1d9}.tag{fill:#58a6ff;font-weight:bold}.ok{fill:#7ee787}.dim{fill:#8b949e}.hi{fill:#fff;font-weight:bold}
.title{fill:#8b949e;font-size:13px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(500px)}}

@keyframes pop{0%{opacity:0;transform:translateY(10px)}6%{opacity:1;transform:translateY(0)}80%{opacity:1;transform:translateY(0)}88%,100%{opacity:0;transform:translateY(-6px)}}
.chip{opacity:0;animation:pop 12s ease-out infinite both}
