<svg xmlns="http://www.w3.org/2000/svg" width="670" height="698" viewBox="0 0 670 698" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
text{font-family:'Courier New',Consolas,monospace;font-size:14px;fill:#e6edf3}
.t{fill:#8b949e;font-size:13px}.cmd{fill:#39ff14;font-size:16px}.nm{font-size:15px;font-weight:bold;fill:#fff}.is{fill:#8b949e;font-size:13px}.ch{font-size:12px;fill:#c9d1d9}
.card{opacity:0;animation:cardin 16s ease-out infinite both}
@keyframes cardin{0%{opacity:0;transform:translateY(14px)}5%,88%{opacity:1;transform:translateY(0)}95%,100%{opacity:0;transform:translateY(0)}}
.chip{opacity:0;transform-box:fill-box;transform-origin:center;animation:chipin 16s ease-out infinite both}
@keyframes chipin{0%{opacity:0;transform:scale(.7)}4%,88%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(1)}}
.ck{stroke-dasharray:40;stroke-dashoffset:40;animation:ck 16s ease-out infinite both}
@keyframes ck{0%,5%{stroke-dashoffset:40}9%,88%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:40}}
.sh{animation:sh 3s linear infinite}@keyframes sh{0%{transform:translateX(0)}100%{transform:translateX(540px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.bl{animation:blink 1s steps(1) infinite}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(698px)}}.scan{animation:scan 7s linear infinite}
.ic{transform-box:fill-box;transform-origin:center;animation:ic 3s ease-in-out infinite}@keyframes ic{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.inf{stroke-dasharray:10 5;animation:inf 1.5s linear infinite}@keyframes inf{to{stroke-dashoffset:-30}}</style>
